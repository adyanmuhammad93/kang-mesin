locale: "id"
backend:
  name: git-gateway
  branch: main

# Integrasi pustaka media Cloudinary (atur kredensial di dasbor Netlify)
# media_library:
#   name: cloudinary
#   config:
#     cloud_name: YOUR_CLOUD_NAME
#     api_key: YOUR_API_KEY

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "products"
    label: "Produk"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "SKU", name: "sku", widget: "string" }
      - label: "Kategori"
        name: "category"
        widget: "select"
        options:
          - "Mesin Industri Makanan"
          - "Mesin Pengolahan Makanan Ringan"
          - "Mesin Pengaduk"
          - "Peralatan Produksi Makanan"
          - "Mesin UMKM"
          - "Mesin Baja Nirkarat Aman Pangan"
          - "Mesin Kustom"
          - "Lainnya"
      - label: "Harga"
        name: "price"
        widget: "string"
        required: false
        hint: "Contoh: Rp 12.500.000, Mulai Rp 8.000.000, atau Hubungi untuk harga. Teks ini tampil di kartu dan halaman detail produk."
      - label: "Galeri Gambar Produk"
        name: "images"
        widget: "list"
        required: false
        summary: "{{fields.image}}"
        hint: "Tambahkan satu atau lebih gambar produk. Gambar pertama akan digunakan sebagai thumbnail katalog dan gambar utama SEO."
        field:
          label: "Gambar"
          name: "image"
          widget: "image"
      - label: "Deskripsi Meta"
        name: "meta_description"
        widget: "text"
        required: false
        hint: "Ringkasan SEO 120–160 karakter untuk hasil pencarian dan pratinjau sosial."
      - { label: "Deskripsi", name: "body", widget: "markdown" }
      - label: "Spesifikasi Teknis"
        name: "specs"
        widget: "list"
        summary: "{{fields.spec}}"
        field:
          label: "Spesifikasi"
          name: "spec"
          widget: "string"
      - label: "Nomor WhatsApp"
        name: "whatsapp_number"
        widget: "string"
        hint: "Cantumkan kode negara, contoh +6281234567890"
  - name: "site_settings"
    label: "Pengaturan Situs"
    files:
      - label: "Landing Page Beranda"
        name: "homepage_landing"
        file: "content/site/settings.md"
        fields:
          - label: "SEO"
            name: "seo_section"
            widget: "object"
            collapsed: true
            fields:
              - label: "Judul Situs"
                name: "site_title"
                widget: "string"
              - label: "Deskripsi Meta Beranda"
                name: "meta_description"
                widget: "text"
                hint: "Ringkasan SEO 120–160 karakter untuk hasil pencarian dan pratinjau sosial."
              - label: "Gambar OG Beranda"
                name: "og_image"
                widget: "image"
                required: false
                hint: "Gambar default untuk pratinjau saat beranda dibagikan di WhatsApp, Facebook, atau X. Rekomendasi rasio 1200x630."
          - label: "Identitas Brand"
            name: "brand_section"
            widget: "object"
            collapsed: false
            fields:
              - label: "Nama Situs"
                name: "site_name"
                widget: "string"
                hint: "Nama brand yang tampil di header, metadata, dan template judul."
              - label: "Tagline Header"
                name: "site_tagline"
                widget: "string"
              - label: "Logo / Icon Header"
                name: "logo_image"
                widget: "image"
                required: false
                hint: "Opsional. Jika kosong, header memakai inisial nama situs."
              - label: "Favicon"
                name: "favicon"
                widget: "image"
                required: false
                hint: "Upload ikon kecil untuk tab browser. Disarankan .ico, .png, atau .svg persegi."
          - label: "Style Customizer"
            name: "design_section"
            widget: "object"
            collapsed: false
            fields:
              - label: "Preset Tema"
                name: "theme_preset"
                widget: "select"
                options:
                  - "Ant Design Blue"
                  - "Industrial Dark"
                  - "Fresh Green"
                  - "Custom"
                hint: "Label tema untuk dokumentasi editor; warna di bawah tetap menjadi sumber utama tampilan."
              - label: "Font Family"
                name: "font_family"
                widget: "select"
                options:
                  - "Inter, system-ui, sans-serif"
                  - "Arial, system-ui, sans-serif"
                  - "Roboto, system-ui, sans-serif"
                  - "Poppins, system-ui, sans-serif"
                  - "system-ui, sans-serif"
              - label: "Warna Utama"
                name: "primary_color"
                widget: "color"
              - label: "Warna Utama Hover/Gelap"
                name: "primary_color_dark"
                widget: "color"
              - label: "Warna Sukses / WhatsApp"
                name: "success_color"
                widget: "color"
              - label: "Warna Background"
                name: "background_color"
                widget: "color"
              - label: "Warna Surface / Kartu"
                name: "surface_color"
                widget: "color"
              - label: "Warna Teks Utama"
                name: "text_color"
                widget: "color"
              - label: "Radius Kartu"
                name: "card_radius"
                widget: "string"
                hint: "Contoh: 1rem, 1.5rem, atau 24px."
              - label: "Radius Tombol"
                name: "button_radius"
                widget: "string"
                hint: "Contoh: 0.75rem, 999px, atau 12px."
          - label: "WhatsApp"
            name: "whatsapp_section"
            widget: "object"
            collapsed: true
            fields:
              - label: "Nomor WhatsApp Utama"
                name: "whatsapp_number"
                widget: "string"
                hint: "Cantumkan kode negara, contoh +6281234567890."
              - label: "Pesan Awal WhatsApp"
                name: "whatsapp_message"
                widget: "text"
          - label: "Hero"
            name: "hero_section"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Teks Kecil", name: "hero_eyebrow", widget: "string" }
              - { label: "Judul Utama", name: "hero_title", widget: "string" }
              - { label: "Judul Sorotan Oranye", name: "hero_highlight", widget: "string" }
              - { label: "Deskripsi Hero", name: "hero_description", widget: "text" }
              - { label: "Label Tombol Utama", name: "hero_primary_label", widget: "string" }
              - { label: "Link Tombol Utama", name: "hero_primary_url", widget: "string" }
              - { label: "Label Tombol WhatsApp", name: "hero_secondary_label", widget: "string" }
              - label: "Poin Keunggulan Hero"
                name: "hero_feature_points"
                widget: "list"
                field: { label: "Poin", name: "point", widget: "string" }
              - { label: "Teks Kecil Kartu Produk", name: "hero_card_eyebrow", widget: "string" }
              - { label: "Judul Kartu Produk", name: "hero_card_title", widget: "string" }
              - { label: "Judul Badge Hero", name: "hero_badge_title", widget: "string" }
              - { label: "Subjudul Badge Hero", name: "hero_badge_text", widget: "string" }
          - label: "Statistik"
            name: "landing_stats"
            widget: "list"
            summary: "{{fields.value}} — {{fields.label}}"
            hint: "Gunakan {products} untuk jumlah produk dan {categories} untuk jumlah kategori otomatis."
            fields:
              - { label: "Angka/Nilai", name: "value", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
          - label: "Bagian Produk"
            name: "products_section"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Teks Kecil", name: "products_eyebrow", widget: "string" }
              - { label: "Judul", name: "products_title", widget: "string" }
              - { label: "Deskripsi", name: "products_description", widget: "text" }
              - { label: "Label Tombol WhatsApp", name: "products_cta_label", widget: "string" }
          - label: "Alur Pembelian"
            name: "order_section"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Teks Kecil", name: "order_eyebrow", widget: "string" }
              - { label: "Judul", name: "order_title", widget: "string" }
              - label: "Langkah"
                name: "order_steps"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Judul Langkah", name: "title", widget: "string" }
                  - { label: "Deskripsi", name: "desc", widget: "text" }
          - label: "Keunggulan"
            name: "about_section"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Teks Kecil", name: "about_eyebrow", widget: "string" }
              - { label: "Judul", name: "about_title", widget: "string" }
              - label: "Daftar Keunggulan"
                name: "about_benefits"
                widget: "list"
                summary: "{{fields.icon}} {{fields.title}}"
                fields:
                  - { label: "Ikon Emoji", name: "icon", widget: "string" }
                  - { label: "Judul", name: "title", widget: "string" }
                  - { label: "Deskripsi", name: "desc", widget: "text" }
              - label: "Kartu Info"
                name: "about_cards"
                widget: "list"
                summary: "{{fields.value}} — {{fields.label}}"
                fields:
                  - { label: "Nilai", name: "value", widget: "string" }
                  - { label: "Label", name: "label", widget: "string" }
          - label: "Kontak dan Footer"
            name: "contact_section"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Teks Kecil Kontak", name: "contact_eyebrow", widget: "string" }
              - { label: "Judul Kontak", name: "contact_title", widget: "string" }
              - { label: "Deskripsi Kontak", name: "contact_description", widget: "text" }
              - { label: "Label Tombol Kontak", name: "contact_cta_label", widget: "string" }
              - { label: "Teks Kecil Peta", name: "maps_eyebrow", widget: "string" }
              - { label: "Judul Peta", name: "maps_title", widget: "string" }
              - { label: "Deskripsi Peta", name: "maps_description", widget: "text" }
              - label: "URL Embed Google Maps"
                name: "maps_embed_url"
                widget: "string"
                required: false
                hint: "Gunakan URL embed Google Maps, contoh https://www.google.com/maps?q=Nama%20Bisnis&output=embed. Kosongkan untuk menyembunyikan iframe peta."
              - label: "URL Buka Google Maps"
                name: "maps_link_url"
                widget: "string"
                required: false
                hint: "Link untuk tombol buka Google Maps."
              - { label: "Teks Copyright", name: "footer_text", widget: "string" }
              - { label: "Tagline Footer", name: "footer_tagline", widget: "string" }
