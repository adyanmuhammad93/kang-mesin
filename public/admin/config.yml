locale: "id"
backend:
  name: git-gateway
  branch: main

# Integrasi pustaka media Cloudinary (atur kredensial di dasbor Netlify)
# media_library:
#   name: cloudinary
#   config:
#     cloud_name: YOUR_CLOUD_NAME
#     api_key: YOUR_API_KEY

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "products"
    label: "Produk"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "SKU", name: "sku", widget: "string" }
      - label: "Kategori"
        name: "category"
        widget: "select"
        options:
          - "Mesin Industri Makanan"
          - "Mesin Pengolahan Makanan Ringan"
          - "Mesin Pengaduk"
          - "Peralatan Produksi Makanan"
          - "Mesin UMKM"
          - "Mesin Baja Nirkarat Aman Pangan"
          - "Mesin Kustom"
          - "Lainnya"
      - label: "Gambar Produk"
        name: "image"
        widget: "image"
        required: false
      - label: "Deskripsi Meta"
        name: "meta_description"
        widget: "text"
        required: false
        hint: "Ringkasan SEO 120–160 karakter untuk hasil pencarian dan pratinjau sosial."
      - { label: "Deskripsi", name: "body", widget: "markdown" }
      - label: "Spesifikasi Teknis"
        name: "specs"
        widget: "list"
        summary: "{{fields.spec}}"
        field:
          label: "Spesifikasi"
          name: "spec"
          widget: "string"
      - label: "Nomor WhatsApp"
        name: "whatsapp_number"
        widget: "string"
        hint: "Cantumkan kode negara, contoh +6281234567890"
  - name: "site_settings"
    label: "Pengaturan Situs"
    files:
      - label: "SEO Beranda"
        name: "homepage_seo"
        file: "content/site/settings.md"
        fields:
          - label: "Gambar OG Beranda"
            name: "og_image"
            widget: "image"
            required: false
            hint: "Gambar default untuk pratinjau saat beranda dibagikan di WhatsApp, Facebook, atau X. Rekomendasi rasio 1200x630."
