backend:
  name: git-gateway
  branch: main

# Cloudinary media library integration (configure your credentials in Netlify dashboard)
# media_library:
#   name: cloudinary
#   config:
#     cloud_name: YOUR_CLOUD_NAME
#     api_key: YOUR_API_KEY

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "products"
    label: "Products"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "SKU", name: "sku", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Mesin Industri Makanan"
          - "Mesin Pengolahan Snack"
          - "Mesin Mixer / Pengaduk"
          - "Peralatan Produksi Makanan"
          - "Mesin UMKM"
          - "Mesin Stainless Food Grade"
          - "Mesin Custom"
          - "Other"
      - label: "Product Image"
        name: "image"
        widget: "image"
        required: false
      - label: "Meta Description"
        name: "meta_description"
        widget: "text"
        required: false
        hint: "Ringkasan SEO 120–160 karakter untuk hasil pencarian dan social preview."
      - { label: "Description", name: "body", widget: "markdown" }
      - label: "Technical Specifications"
        name: "specs"
        widget: "list"
        summary: "{{fields.spec}}"
        field:
          label: "Spec"
          name: "spec"
          widget: "string"
      - label: "WhatsApp Number"
        name: "whatsapp_number"
        widget: "string"
        hint: "Include country code, e.g. +6281234567890"
  - name: "site_settings"
    label: "Site Settings"
    files:
      - label: "Homepage SEO"
        name: "homepage_seo"
        file: "content/site/settings.md"
        fields:
          - label: "Homepage OG Image"
            name: "og_image"
            widget: "image"
            required: false
            hint: "Gambar default untuk preview saat homepage dibagikan di WhatsApp, Facebook, atau X. Rekomendasi rasio 1200x630."
